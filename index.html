<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Rosiento</title>
<!-- Firebase Compat CDN -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  /* Body ve arka plan */
  body {
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    color:white;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: url('https://i.postimg.cc/Y2LZxkJz/dancing-background.gif') center/cover no-repeat;
  }

  /* Box */
  .box {
    background: rgba(0,0,0,0.6);
    padding: 30px;
    border-radius: 15px;
    width: 320px;
    text-align:center;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }

  input {
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
    font-size:14px;
  }

  /* Butonlar */
  button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background: linear-gradient(45deg,#ff0066,#ffcc00);
    color:white;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
  }

  button:hover {
    transform: translateY(-5px);
    background: linear-gradient(45deg,#00ccff,#ff00ff);
  }

  #welcome,#roomBox{display:none;}
</style>
</head>
<body>

<!-- Arka plan müzik -->
<audio autoplay loop>
  <source src="https://www.example.com/sarkiniz.mp3" type="audio/mpeg">
  Tarayıcı audio desteklemiyor.
</audio>

<div class="box" id="authBox">
  <h2>Rosiento</h2>
  <p>Bizi seçtiğiniz için teşekkürler</p>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="register()">Kayıt Ol</button>
  <button onclick="login()">Giriş Yap</button>
</div>

<div class="box" id="welcome">
  <h2>Hoşgeldin 👋</h2>
  <p id="userEmail"></p>
  <button onclick="logout()">Çıkış Yap</button>
</div>

<div class="box" id="roomBox">
  <h3>Oda Oluştur</h3>
  <input id="roomName" placeholder="Oda Adı">
  <button onclick="createRoom()">Oda Oluştur</button>
  <h4>Senin Odaların:</h4>
  <ul id="myRooms"></ul>
</div>

<script>
  // Firebase config kendi bilgilerinle değiştir
  const firebaseConfig = {
    apiKey: "KENDI_API_KEYINIZ",
    authDomain: "KENDI_AUTH_DOMAIN",
    projectId: "KENDI_PROJECT_ID",
    storageBucket: "KENDI_STORAGE_BUCKET",
    messagingSenderId: "KENDI_SENDER_ID",
    appId: "KENDI_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  window.register = function(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    if(!email || !password){ alert("Email ve şifre girin!"); return; }
    auth.createUserWithEmailAndPassword(email,password)
      .then(()=>alert("Kayıt başarılı!"))
      .catch(e=>alert(e.message));
  }

  window.login = function(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    if(!email || !password){ alert("Email ve şifre girin!"); return; }
    auth.signInWithEmailAndPassword(email,password)
      .then(()=>alert("Giriş başarılı!"))
      .catch(e=>alert(e.message));
  }

  window.logout = function(){ auth.signOut(); }

  window.createRoom = function(){
    const name = document.getElementById("roomName").value;
    if(!name){ alert("Oda adı girin!"); return; }
    const user = auth.currentUser;
    if(!user){ alert("Giriş yapmalısın!"); return; }

    db.collection("rooms").add({
      name: name,
      ownerUID: user.uid,
      members: [user.uid]
    }).then(docRef=>{
      alert("Oda oluşturuldu! ID: "+docRef.id);
      loadRooms();
    }).catch(e=>alert(e.message));
  }

  function loadRooms(){
    const user = auth.currentUser;
    if(!user) return;
    db.collection("rooms").get().then(snapshot=>{
      const ul = document.getElementById("myRooms");
      ul.innerHTML="";
      snapshot.forEach(doc=>{
        const data = doc.data();
        if(data.ownerUID===user.uid){
          const li=document.createElement("li");
          li.innerText = data.name+" (ID: "+doc.id+")";
          ul.appendChild(li);
        }
      });
    });
  }

  auth.onAuthStateChanged(function(user){
    if(user){
      document.getElementById("authBox").style.display="none";
      document.getElementById("welcome").style.display="block";
      document.getElementById("userEmail").innerText=user.email;
      document.getElementById("roomBox").style.display="block";
      loadRooms();
    }else{
      document.getElementById("authBox").style.display="block";
      document.getElementById("welcome").style.display="none";
      document.getElementById("roomBox").style.display="none";
    }
  });
</script>

</body>
</html>
