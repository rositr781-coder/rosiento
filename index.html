<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Rosiento</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>
  <style>
    body { background:#1e1e1e; color:white; font-family:Arial; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:50px 0; margin:0;}
    .box{background:#2a2a2a;padding:30px;border-radius:10px;width:300px;text-align:center;margin-bottom:20px;}
    input{width:100%;padding:10px;margin:8px 0;background:#333;border:none;color:white;border-radius:5px;}
    button{width:100%;padding:10px;margin-top:10px;background:#555;border:none;color:white;border-radius:5px;cursor:pointer;}
    button:hover{background:#777;}
    #welcome,#roomBox{display:none;}
  </style>
</head>
<body>

<div class="box" id="authBox">
  <h2>Rosiento</h2>
  <p>Bizi seçtiğiniz için teşekkürler</p>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="register()">Kayıt Ol</button>
  <button onclick="login()">Giriş Yap</button>
</div>

<div class="box" id="welcome">
  <h2>Hoşgeldin 👋</h2>
  <p id="userEmail"></p>
  <button onclick="logout()">Çıkış Yap</button>
</div>

<div class="box" id="roomBox">
  <h3>Oda Oluştur</h3>
  <input id="roomName" placeholder="Oda Adı">
  <button onclick="createRoom()">Oda Oluştur</button>
  <h4>Senin Odaların:</h4>
  <ul id="myRooms"></ul>
</div>

<script>
  // 🔹 Firebase config (kendi projen ile değiştir)
  const firebaseConfig = {
    apiKey: "KENDI_API_KEYINIZ",
    authDomain: "KENDI_AUTH_DOMAIN",
    projectId: "KENDI_PROJECT_ID",
    storageBucket: "KENDI_STORAGE_BUCKET",
    messagingSenderId: "KENDI_SENDER_ID",
    appId: "KENDI_APP_ID"
  };

  // Firebase initialize
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // 🔹 Fonksiyonlar
  function register(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    if(!email || !password){ alert("Email ve şifre girin!"); return; }
    auth.createUserWithEmailAndPassword(email,password)
      .then(()=>alert("Kayıt başarılı!"))
      .catch(e=>alert(e.message));
  }

  function login(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    if(!email || !password){ alert("Email ve şifre girin!"); return; }
    auth.signInWithEmailAndPassword(email,password)
      .then(()=>alert("Giriş başarılı!"))
      .catch(e=>alert(e.message));
  }

  function logout(){ auth.signOut(); }

  function createRoom(){
    const name = document.getElementById("roomName").value;
    if(!name){ alert("Oda adı girin!"); return; }
    const user = auth.currentUser;
    if(!user){ alert("Giriş yapmalısın!"); return; }

    db.collection("rooms").add({
      name: name,
      ownerUID: user.uid,
      members: [user.uid]
    }).then(docRef=>{
      alert("Oda oluşturuldu! ID: "+docRef.id);
      loadRooms();
    }).catch(e=>alert(e.message));
  }

  function loadRooms(){
    const user = auth.currentUser;
    if(!user) return;
    db.collection("rooms").get().then(snapshot=>{
      const ul = document.getElementById("myRooms");
      ul.innerHTML="";
      snapshot.forEach(doc=>{
        const data = doc.data();
        if(data.ownerUID===user.uid){
          const li=document.createElement("li");
          li.innerText = data.name+" (ID: "+doc.id+")";
          ul.appendChild(li);
        }
      });
    });
  }

  auth.onAuthStateChanged(function(user){
    if(user){
      document.getElementById("authBox").style.display="none";
      document.getElementById("welcome").style.display="block";
      document.getElementById("userEmail").innerText=user.email;
      document.getElementById("roomBox").style.display="block";
      loadRooms();
    }else{
      document.getElementById("authBox").style.display="block";
      document.getElementById("welcome").style.display="none";
      document.getElementById("roomBox").style.display="none";
    }
  });
</script>

</body>
</html>
