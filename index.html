<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Rosiento</title>
<style>
body {
  margin:0;
  padding:0;
  font-family: Arial, sans-serif;
  color:white;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background: #000; /* siyah arka plan */
  padding-top:50px;
}
.box {
  background: rgba(128,128,128,0.9); /* gri kutular */
  padding: 30px;
  border-radius: 15px;
  width: 400px;
  text-align:center;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  margin-bottom:20px;
}
input, textarea {
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
  font-size:14px;
}
textarea { resize:none; height:80px; }
button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background: linear-gradient(45deg,#ff0066,#ffcc00);
  color:white;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}
button:hover {
  transform: translateY(-5px);
  background: linear-gradient(45deg,#00ccff,#ff00ff);
}
#usernameBox,#chatBox{display:none;}
ul{list-style:none;padding-left:0; max-height:150px; overflow-y:auto;}
</style>
</head>
<body>

<!-- Müzik -->
<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<!-- Hover bip -->
<audio id="hoverSound" src="https://www.soundjay.com/button/beep-07.mp3"></audio>

<!-- Anonim giriş box -->
<div class="box" id="authBox">
  <h2>Rosiento</h2>
  <p>Bizi seçtiğiniz için teşekkürler</p>
  <button id="anonLoginBtn">Anonim Giriş</button>
  <p id="authError" style="color:#ff5555; font-weight:bold; margin-top:10px;"></p>
</div>

<!-- Kullanıcı adı seçme -->
<div class="box" id="usernameBox">
  <h2>Kullanıcı Adı Seç</h2>
  <input type="text" id="usernameInput" placeholder="Kullanıcı adınız">
  <button id="setUsernameBtn">Kaydet</button>
</div>

<!-- Chat Box -->
<div class="box" id="chatBox">
  <h3 id="chatUser"></h3>
  <ul id="messages"></ul>
  <textarea id="messageText" placeholder="Mesaj yaz..."></textarea>
  <button id="sendBtn">Gönder</button>
  <button id="addFriendBtn">Arkadaş Ekle</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAjBq1iFeKcJjrWbQloiYys7ALQv8_TdZ0",
  authDomain: "rosiento-b1c92.firebaseapp.com",
  projectId: "rosiento-b1c92",
  storageBucket: "rosiento-b1c92.firebasestorage.app",
  messagingSenderId: "221538415094",
  appId: "1:221538415094:web:8cbf6ffc52ed0505c957d7"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Anonim giriş
window.anonLogin = async function() {
  const errorBox = document.getElementById("authError");
  try{
    await auth.signInAnonymously();
    errorBox.style.color="lime";
    errorBox.innerText="Anonim giriş başarılı!";
    document.getElementById("authBox").style.display="none";
    document.getElementById("usernameBox").style.display="block";
  }catch(e){
    errorBox.style.color="#ff5555";
    errorBox.innerText=e.message;
  }
}

// Kullanıcı adı kaydet
document.getElementById("setUsernameBtn").onclick = function(){
  const name = document.getElementById("usernameInput").value.trim();
  if(!name){ alert("Kullanıcı adı gir!"); return; }
  const user = auth.currentUser;
  if(!user){ alert("Önce giriş yap!"); return; }
  db.collection("users").doc(user.uid).set({username:name})
    .then(()=>{
      document.getElementById("usernameBox").style.display="none";
      document.getElementById("chatBox").style.display="block";
      document.getElementById("chatUser").innerText = name;
    });
}

// Mesaj gönder
document.getElementById("sendBtn").onclick = function(){
  const text = document.getElementById("messageText").value;
  const user = auth.currentUser;
  if(!text || !user){ alert("Mesaj yaz ve giriş yap!"); return; }
  db.collection("messages").add({
    sender:user.uid,
    text:text,
    timestamp:firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>document.getElementById("messageText").value="");
}

// Arkadaş ekle simülasyonu
document.getElementById("addFriendBtn").onclick = function(){
  const friendName = prompt("Arkadaşının kullanıcı adını yaz:");
  if(friendName) alert(friendName + " arkadaş olarak eklendi!");
}

// Hover bip sesi
const hoverSound = document.getElementById("hoverSound");
document.querySelectorAll("button").forEach(btn => {
  btn.addEventListener("mouseenter", () => {
    hoverSound.currentTime = 0;
    hoverSound.play();
  });
});

// Anonim giriş buton event
document.getElementById("anonLoginBtn").onclick = anonLogin;
</script>
</body>
</html>
