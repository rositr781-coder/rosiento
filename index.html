<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Rosiento</title>
<style>
body {
  margin:0;
  padding:0;
  font-family: Arial, sans-serif;
  color:white;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background: url('https://i.postimg.cc/9M6FGZz1/static-background.jpg') center/cover no-repeat;
  padding-top:50px;
}
.box {
  background: rgba(0,0,0,0.8);
  padding: 30px;
  border-radius: 15px;
  width: 350px;
  text-align:center;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  margin-bottom:20px;
}
input, textarea {
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
  font-size:14px;
}
textarea { resize:none; height:80px; }
button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background: linear-gradient(45deg,#ff0066,#ffcc00);
  color:white;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}
button:hover {
  transform: translateY(-5px);
  background: linear-gradient(45deg,#00ccff,#ff00ff);
}
#welcome,#roomBox,#chatBox,#adminPanel{display:none;}
ul{list-style:none;padding-left:0; max-height:150px; overflow-y:auto;}
</style>
</head>
<body>

<!-- Ana müzik -->
<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<!-- Hover bip sesi -->
<audio id="hoverSound" src="https://www.soundjay.com/button/beep-07.mp3"></audio>

<div class="box" id="authBox">
  <h2>Rosiento</h2>
  <p>Bizi seçtiğiniz için teşekkürler</p>
  
  <input type="text" id="phone" placeholder="Telefon numarası (+90...)">
  <div id="recaptcha-container"></div>
  <button id="phoneLoginBtn">Telefon ile Giriş</button>
  
  <button id="anonLoginBtn">Anonim Giriş</button>
  <p id="authError" style="color:#ff5555; font-weight:bold; margin-top:10px;"></p>
</div>

<div class="box" id="welcome">
  <h2>Hoşgeldin 👋</h2>
  <p id="userEmail"></p>
  <button id="logoutBtn">Çıkış Yap</button>
</div>

<div class="box" id="roomBox">
  <h3>Oda Oluştur</h3>
  <input id="roomName" placeholder="Oda Adı">
  <button id="createRoomBtn">Oda Oluştur</button>
  <h4>Senin Odaların:</h4>
  <ul id="myRooms"></ul>
</div>

<div class="box" id="chatBox">
  <h3 id="chatRoomName">Oda</h3>
  <ul id="messages"></ul>
  <textarea id="messageText" placeholder="Mesaj yaz..."></textarea>
  <button id="sendBtn">Gönder</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAjBq1iFeKcJjrWbQloiYys7ALQv8_TdZ0",
  authDomain: "rosiento-b1c92.firebaseapp.com",
  projectId: "rosiento-b1c92",
  storageBucket: "rosiento-b1c92.firebasestorage.app",
  messagingSenderId: "221538415094",
  appId: "1:221538415094:web:8cbf6ffc52ed0505c957d7"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Telefon login
window.phoneLogin = async function() {
  const phone = document.getElementById("phone").value;
  const errorBox = document.getElementById("authError");
  if(!phone){ errorBox.innerText="Telefon numarası girin!"; return; }

  window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {'size':'invisible'});
  try {
    const confirmationResult = await auth.signInWithPhoneNumber(phone, recaptchaVerifier);
    const code = prompt("SMS kodunu girin:");
    await confirmationResult.confirm(code);
    errorBox.style.color="lime";
    errorBox.innerText="Giriş başarılı!";
  } catch(e){
    errorBox.style.color="#ff5555";
    errorBox.innerText=e.message;
  }
}

// Anonim giriş
window.anonLogin = async function() {
  const errorBox = document.getElementById("authError");
  try{
    await auth.signInAnonymously();
    errorBox.style.color="lime";
    errorBox.innerText="Anonim giriş başarılı!";
  }catch(e){
    errorBox.style.color="#ff5555";
    errorBox.innerText=e.message;
  }
}

function logout(){ auth.signOut(); }

function createRoom(){
  const name=document.getElementById("roomName").value;
  const user=auth.currentUser;
  if(!name||!user){ alert("Oda adı girin ve giriş yapın!"); return; }
  db.collection("rooms").add({name:name, ownerUID:user.uid, members:[user.uid]})
    .then(()=>{ alert("Oda oluşturuldu!"); loadRooms(); })
    .catch(e=>alert(e.message));
}

function loadRooms(){
  const user=auth.currentUser;
  if(!user) return;
  db.collection("rooms").get().then(snapshot=>{
    const ul=document.getElementById("myRooms"); ul.innerHTML="";
    snapshot.forEach(doc=>{
      const data=doc.data();
      if(data.members.includes(user.uid)){
        const li=document.createElement("li");
        li.innerText=data.name;
        li.style.cursor="pointer";
        li.onclick=()=>enterRoom(doc.id,data.name);
        ul.appendChild(li);
      }
    });
  });
}

let currentRoomId=null;
function enterRoom(roomId,roomName){
  currentRoomId=roomId;
  document.getElementById("chatRoomName").innerText=roomName;
  document.getElementById("chatBox").style.display="block";
  document.getElementById("roomBox").style.display="none";
  const messagesUl=document.getElementById("messages"); messagesUl.innerHTML="";
  db.collection("rooms").doc(roomId).collection("messages").orderBy("timestamp")
    .onSnapshot(snapshot=>{
      messagesUl.innerHTML="";
      snapshot.forEach(doc=>{
        const msg=doc.data();
        const li=document.createElement("li");
        li.innerText=${msg.sender || "Anonim"}: ${msg.text};
        messagesUl.appendChild(li);
      });
    });
}

function sendMessage(){
  const text=document.getElementById("messageText").value;
  const user=auth.currentUser;
  if(!text||!user||!currentRoomId){ alert("Mesaj yaz ve bir odaya gir!"); return; }
  db.collection("rooms").doc(currentRoomId).collection("messages")
    .add({ sender:user.phoneNumber || "Anonim", text:text, timestamp:firebase.firestore.FieldValue.serverTimestamp() })
    .then(()=>document.getElementById("messageText").value="");
}

auth.onAuthStateChanged(function(user){
  if(user){
    document.getElementById("authBox").style.display="none";
    document.getElementById("welcome").style.display="block";
    document.getElementById("userEmail").innerText=user.phoneNumber || "Anonim Kullanıcı";
    document.getElementById("roomBox").style.display="block";
    loadRooms();
  }else{
    document.getElementById("authBox").style.display="block";
    document.getElementById("welcome").style.display="none";
    document.getElementById("roomBox").style.display="none";
    document.getElementById("chatBox").style.display="none";
  }
});

// Event Listeners
document.getElementById("phoneLoginBtn").onclick = phoneLogin;
document.getElementById("anonLoginBtn").onclick = anonLogin;
document.getElementById("logoutBtn").onclick = logout;
document.getElementById("createRoomBtn").onclick = createRoom;
document.getElementById("sendBtn").onclick = sendMessage;

// Hover bip sesi
const hoverSound = document.getElementById("hoverSound");
document.querySelectorAll("button").forEach(btn => {
  btn.addEventListener("mouseenter", () => {
    hoverSound.currentTime = 0;
    hoverSound.play();
  });
});

</script>
</body>
</html>
